<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aletheia Apps</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #2C2420;
      --cream: #FAF7F2;
      --brown: #8B6F5E;
      --accent: #D4623A;
      --text-muted: #9B8B80;
      --tan: #E8DDD0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .container {
      max-width: 520px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 17px;
      color: var(--brown);
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 48px;
    }

    .app-card {
      background: white;
      border: 1px solid var(--tan);
      border-radius: 16px;
      padding: 32px;
      text-align: left;
      transition: border-color 0.2s;
    }

    .app-card:hover {
      border-color: var(--accent);
    }

    .app-name {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .app-name em {
      color: var(--accent);
      font-style: italic;
      font-weight: 400;
    }

    .app-desc {
      font-size: 15px;
      color: var(--brown);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .app-link {
      display: inline-block;
      color: var(--accent);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }

    .app-link:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 64px;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Aletheia</h1>
    <p class="tagline">Consumer apps built on transparency.</p>

    <div class="app-card">
      <div class="app-name">sous<em>chef</em></div>
      <p class="app-desc">Meal planning and grocery management for families. Plan dinners, build grocery lists, order online, and track what you buy.</p>
      <a href="https://getsouschef.app" class="app-link">getsouschef.app &rarr;</a>
    </div>
  </div>

  <footer>&copy; 2026 Aletheia LLC</footer>
</body>
</html>
